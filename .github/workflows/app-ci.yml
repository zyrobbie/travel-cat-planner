name: E0-E1 application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: catletters
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: catletters
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catletters"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://catletters:synthetic-ci-only@127.0.0.1:5432/catletters
      APP_ORIGIN: http://127.0.0.1:3100
      ADMIN_SECRET: synthetic-ci-admin-only-not-production-credential
      APP_MODE: INTERNAL
      SAFETY_ADAPTER: synthetic-v1
      COOKIE_SECURE: "false"
      E4_LEDGER_SECRET: synthetic-ci-only-ledger-secret-not-a-production-key
      E4_LIFECYCLE_BOOTSTRAP: "true"
    steps:
      - name: Configure private lifecycle directory
        run: printf 'E4_LIFECYCLE_DIR=%s/catletters-ci-private-lifecycle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx tsx scripts/lifecycle.ts reconcile
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E4-A isolated PostgreSQL and synthetic OTP HTTP checks
        run: node scripts/test-e4-account.mjs --from-env --evidence-dir .local/e4-account-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-account-evidence
          path: .local/e4-account-evidence
          include-hidden-files: true
          if-no-files-found: ignore
      - name: E4-B1 isolated PostgreSQL cloud mailbox and HTTP checks
        run: node scripts/test-e4-cloud.mjs --from-env --evidence-dir .local/e4-cloud-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-cloud-evidence
          path: .local/e4-cloud-evidence
          include-hidden-files: true
          if-no-files-found: ignore
      - name: E4-B2 isolated calendar and background worker checks
        run: node scripts/test-e4-calendar.mjs --from-env --evidence-dir .local/e4-calendar-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-calendar-evidence
          path: .local/e4-calendar-evidence
          include-hidden-files: true
          if-no-files-found: ignore
      - name: E4-B3 isolated legacy binding, HTTP and Chromium checks
        run: node scripts/test-e4-binding.mjs --from-env --evidence-dir .local/e4-binding-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-binding-evidence
          path: .local/e4-binding-evidence
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Install matching PostgreSQL 17 backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - name: E4-C private export, deletion and backup restore checks
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
          PG_RESTORE_BIN: /usr/lib/postgresql/17/bin/pg_restore
        run: |
          test -x "$PG_DUMP_BIN" && test -x "$PG_RESTORE_BIN"
          node scripts/test-e4-lifecycle.mjs --from-env --evidence-dir .local/e4-lifecycle-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-lifecycle-evidence
          path: .local/e4-lifecycle-evidence
          include-hidden-files: true
          if-no-files-found: ignore
      - run: |
          node ui-adoption-flow-v1/checks/flow-state.test.mjs
          node ui-adoption-flow-v1/checks/preview-identity.test.mjs
          node ui-daily-core-v1/checks/daily-state.test.mjs
          node ui-daily-core-v1/checks/g2r-state.test.mjs
          node ui-components-v1/checks/daily-components.test.mjs
      - run: npm run build
      - run: node scripts/start-local.mjs
      - run: npm run test:e2e
