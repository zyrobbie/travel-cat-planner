name: E0-E1 application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: catletters
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: catletters
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catletters"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://catletters:synthetic-ci-only@127.0.0.1:5432/catletters
      APP_ORIGIN: http://127.0.0.1:3100
      ADMIN_SECRET: synthetic-ci-admin-only-not-production-credential
      APP_MODE: INTERNAL
      SAFETY_ADAPTER: synthetic-v1
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/start-local.mjs
      - run: npm run test:e2e
