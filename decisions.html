<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当下待决策议题 · 旅行小猫</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="docnav">
    <a href="index.html">← 返回目录</a>
    <span id="progress-hint" style="color:var(--ink-soft);font-size:13px;"></span>
  </div>

  <!-- 填写视图 -->
  <div id="form-view">
    <div class="hero" style="padding:8px 0 12px;">
      <div class="paw">🚪</div>
      <h1>当下待决策议题</h1>
      <div class="sub">Phase 1 已完成 · Gate 1 与收敛会前需要产品负责人拍板的事项</div>
      <div class="meta-bar">
        <span>📅 2026-09-08</span>
        <span>选择题点选卡片 · 开放题直接作答</span>
        <span>答案自动保存在本机浏览器</span>
      </div>
    </div>
    <div id="questions"></div>
    <div class="action-bar">
      <button class="btn" id="gen-btn">生成「问题 + 答案」汇总页 →</button>
      <div class="save-hint">答案实时保存在本机浏览器（localStorage），可随时离开、随时回来继续</div>
    </div>
  </div>

  <!-- 汇总视图 -->
  <div id="summary-view" style="display:none;">
    <div class="summary-head">
      <div class="paw" style="font-size:40px;">🐈</div>
      <h2>旅行小猫 · 决策汇总</h2>
      <div class="sub" id="summary-date" style="color:var(--ink-soft);font-size:14px;"></div>
    </div>
    <div id="answers"></div>
    <div class="summary-foot">
      <p>本页供截图存档 · 截图后请将结论同步至《旅行小猫项目执行总纲》决策日志</p>
    </div>
    <div class="summary-actions">
      <button class="btn ghost" id="back-btn">← 返回修改</button>
      <button class="btn ghost" id="clear-btn">清空全部答案</button>
    </div>
  </div>

  <footer>
    <p>🐾 旅行小猫 · 由产品战略团队 AI 协作推进 · 重要决策由产品负责人审定</p>
  </footer>

</div>
<script>
var QUESTIONS = [
  {
    id: "q1", type: "choice",
    title: "Gate 1 是否签字过门？（三项门槛已满足：三问题有答案 / 三报告落盘 / 留存基准线有数值）",
    ctx: "签字即进入 Phase 2 概念收敛会。依据：《Phase 1 调研汇总》🚪 检查表",
    options: [
      { key: "A", label: "签字过门，进入 Phase 2", desc: "确认汇总与三份报告，启动收敛会筹备" },
      { key: "B", label: "暂缓，需补充材料", desc: "在 Q9 写明需要补充什么" },
      { key: "C", label: "不签字", desc: "在 Q9 说明原因" }
    ]
  },
  {
    id: "q2", type: "choice",
    title: "红线提案 R7「善终机制」是否批准？",
    ctx: "任何模型更换 / 功能下线 / 服务终止，必须有用户情感资产处置方案（数据导出 / 纪念册 / 温柔告别）",
    options: [
      { key: "A", label: "批准，写入红线 R7", desc: "Phase 3 设计时纳入善终机制" },
      { key: "B", label: "修改后批准", desc: "修改意见写在 Q9" },
      { key: "C", label: "不批准", desc: "在 Q9 说明理由" }
    ]
  },
  {
    id: "q3", type: "choice",
    title: "旅蛙停运怀旧流量窗口（2026.9–12，12-08 关服）是否改变现有节奏？",
    ctx: "窗口期真实存在，但手册原则是不因流量窗口牺牲红线与质量门槛",
    options: [
      { key: "A", label: "保持原节奏", desc: "按手册相对时间轴推进，不为窗口赶工" },
      { key: "B", label: "提前 MVP 承接窗口", desc: "压缩 Phase 2–4 节奏，争取窗口期内上线" },
      { key: "C", label: "仅营销侧承接，不动开发节奏", desc: "做内容/话题承接怀旧情绪，产品节奏不变" }
    ]
  },
  {
    id: "q4", type: "choice",
    title: "载体形态拍板：小程序 / App / H5？",
    ctx: "原始想法中出现「小程序」提法；手册原定留 Gate 2 决策，可提前拍板",
    options: [
      { key: "A", label: "微信小程序", desc: "低门槛触达、碎片时间场景匹配目标用户" },
      { key: "B", label: "独立 App", desc: "体验完整、推送能力强，但获客门槛高" },
      { key: "C", label: "H5 先行验证", desc: "最轻量验证记忆联动，之后再看载体" },
      { key: "D", label: "留到收敛会再定", desc: "按原计划 Gate 2 拍板" }
    ]
  },
  {
    id: "q5", type: "choice",
    title: "情绪记录可视化：做不做、做到什么程度？",
    ctx: "瑞思提示双面性：回顾成就感 vs 自我监控焦虑",
    options: [
      { key: "A", label: "做完整版", desc: "含情绪曲线、词云等丰富可视化" },
      { key: "B", label: "只做简化版", desc: "仅明信片册时间线回看，不做情绪打分" },
      { key: "C", label: "暂不做", desc: "MVP 外，Later 候选再评" }
    ]
  },
  {
    id: "q6", type: "open",
    title: "呼应质量盲评「感动 / 真实」达标率阈值，你定多少？",
    ctx: "Phase 3 技术 PoC 的 Gate 3 标准（如：≥80%）。定高了可能不过门，定低了伤害体验"
  },
  {
    id: "q7", type: "open",
    title: "慢 vs 快需求分裂：2–3 天延迟是在筛选用户，还是会流失「想被即时接住」的人？",
    ctx: "瑞思矛盾点 1：Slowly 证明慢有忠粉，但「秒回师」热销证明另一批人为即时回应付费。你的倾向与理由？"
  },
  {
    id: "q8", type: "open",
    title: "法务 / 伦理评审资源：Phase 3 危机机制（P0）需要法务介入，是否有可用资源？",
    ctx: "可写：可用的法务渠道 / 外部顾问 / 需要团队先出自查清单替代等"
  },
  {
    id: "q9", type: "open",
    title: "机制砍留与其他补充意见",
    ctx: "心愿卡 / 选择性领取 / 出行节奏 / 记忆联动 / 回看记录——想砍、想改、想加什么？以及任何其他决策意见（含上面选择题选 B/C 的说明）"
  }
];

var LS_KEY = "travel-cat-decisions-v1";

function loadAnswers() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveAnswers(a) {
  localStorage.setItem(LS_KEY, JSON.stringify(a));
  updateProgress();
}
function updateProgress() {
  var a = loadAnswers(), done = 0;
  QUESTIONS.forEach(function (q) {
    if (a[q.id] && String(a[q.id]).trim() !== "") done++;
  });
  document.getElementById("progress-hint").textContent = "已答 " + done + " / " + QUESTIONS.length;
}

function renderForm() {
  var answers = loadAnswers();
  var html = "";
  QUESTIONS.forEach(function (q, i) {
    html += '<div class="qcard" id="card-' + q.id + '">';
    html += '<div class="qhead"><span class="qno">Q' + (i + 1) + '</span>' +
      '<span class="qtype ' + (q.type === "choice" ? "choice" : "") + '">' +
      (q.type === "choice" ? "选择题" : "开放题") + "</span></div>";
    html += "<h3>" + q.title + "</h3>";
    if (q.ctx) html += '<div class="qctx">' + q.ctx + "</div>";
    if (q.type === "choice") {
      html += '<div class="opts">';
      q.options.forEach(function (o) {
        var sel = answers[q.id] === o.key ? " sel" : "";
        html += '<div class="opt' + sel + '" data-q="' + q.id + '" data-v="' + o.key + '">' +
          '<span class="key">' + o.key + '</span>' +
          "<span>" + o.label + (o.desc ? '<span class="od">' + o.desc + "</span>" : "") + "</span></div>";
      });
      html += "</div>";
    } else {
      var v = answers[q.id] ? String(answers[q.id]).replace(/</g, "&lt;") : "";
      html += '<textarea data-q="' + q.id + '" placeholder="在这里写下你的回答…">' + v + "</textarea>";
    }
    html += "</div>";
  });
  document.getElementById("questions").innerHTML = html;

  document.querySelectorAll(".opt").forEach(function (el) {
    el.addEventListener("click", function () {
      var qid = el.getAttribute("data-q"), v = el.getAttribute("data-v");
      var a = loadAnswers();
      a[qid] = v;
      saveAnswers(a);
      document.querySelectorAll('.opt[data-q="' + qid + '"]').forEach(function (o) {
        o.classList.toggle("sel", o.getAttribute("data-v") === v);
      });
    });
  });
  document.querySelectorAll("textarea[data-q]").forEach(function (el) {
    el.addEventListener("input", function () {
      var a = loadAnswers();
      a[el.getAttribute("data-q")] = el.value;
      saveAnswers(a);
    });
  });
  updateProgress();
}

function optionLabel(q, key) {
  var found = null;
  (q.options || []).forEach(function (o) { if (o.key === key) found = o; });
  return found ? found.key + " · " + found.label : key;
}

function renderSummary() {
  var answers = loadAnswers();
  var now = new Date();
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  document.getElementById("summary-date").textContent =
    "决策人：罗比 · " + now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
  var html = "";
  QUESTIONS.forEach(function (q, i) {
    var v = answers[q.id];
    var has = v && String(v).trim() !== "";
    var text = has ? (q.type === "choice" ? optionLabel(q, v) : String(v).replace(/</g, "&lt;").replace(/\n/g, "<br>")) : "";
    html += '<div class="ans-card">';
    html += '<div class="q"><b>Q' + (i + 1) + "</b> · " + q.title + "</div>";
    html += '<div class="a' + (has ? "" : " empty") + '">' + (has ? text : "（未作答）") + "</div>";
    html += "</div>";
  });
  document.getElementById("answers").innerHTML = html;
}

document.getElementById("gen-btn").addEventListener("click", function () {
  renderSummary();
  document.getElementById("form-view").style.display = "none";
  document.getElementById("summary-view").style.display = "block";
  window.scrollTo(0, 0);
});
document.getElementById("back-btn").addEventListener("click", function () {
  document.getElementById("summary-view").style.display = "none";
  document.getElementById("form-view").style.display = "block";
  window.scrollTo(0, 0);
});
document.getElementById("clear-btn").addEventListener("click", function () {
  if (confirm("确定清空全部答案吗？此操作不可撤销。")) {
    localStorage.removeItem(LS_KEY);
    renderForm();
    document.getElementById("summary-view").style.display = "none";
    document.getElementById("form-view").style.display = "block";
  }
});

renderForm();
</script>
</body>
</html>
