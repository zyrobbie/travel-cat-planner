# Standalone master; never include this in /etc/nginx/nginx.conf or the old site.
daemon off;
worker_processes 1;
pid /run/cat-voice-proxy/nginx.pid;
error_log stderr crit;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 11m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    client_body_temp_path /run/cat-voice-proxy/client-body;
    proxy_temp_path /run/cat-voice-proxy/upstream;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_ignore_headers X-Accel-Buffering;
    proxy_http_version 1.1;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;
    proxy_send_timeout 15s;

    # Only these two cookie names reach the independent app. An old session
    # sent by the browser to the same host:8443 is never forwarded upstream.
    map $http_cookie $catvoice_account {
        default "";
        "~(?:^|;\s*)cat_voice_test_session=(?<catvoice_session>[a-f0-9]{64})(?:;|$)" "cat_voice_test_session=$catvoice_session;";
    }
    map $http_cookie $catvoice_deletion {
        default "";
        "~(?:^|;\s*)cat_voice_test_deletion=(?<catvoice_receipt>[a-f0-9-]{36}\.[a-f0-9]{64})(?:;|$)" "cat_voice_test_deletion=$catvoice_receipt;";
    }
    # Reject ambiguous duplicate cookie names rather than selecting one value.
    map $http_cookie $catvoice_duplicate_cookie {
        default 0;
        "~(?:^|;\s*)cat_voice_test_session=[^;]*(?:;[^;]*)*;\s*cat_voice_test_session=" 1;
        "~(?:^|;\s*)cat_voice_test_deletion=[^;]*(?:;[^;]*)*;\s*cat_voice_test_deletion=" 1;
    }
    upstream catvoice_app { server 127.0.0.1:3187; }
    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name cat-test.zyrobbie.site;
        ssl_certificate /etc/cat-voice-test/proxy/fullchain.pem;
        ssl_certificate_key /etc/cat-voice-test/proxy/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        absolute_redirect off;
        auth_basic "Private E4-E test";
        auth_basic_user_file /etc/cat-voice-test/proxy/htpasswd;
        # The delivered gate is return 503 for the entire site and every API.
        include /etc/cat-voice-test/proxy/entry-gate.conf;
        if ($http_host != "cat-test.zyrobbie.site:8443") { return 421; }
        if ($catvoice_duplicate_cookie) { return 400; }
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_set_header Host "cat-test.zyrobbie.site:8443";
        proxy_set_header X-Forwarded-Host "cat-test.zyrobbie.site:8443";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "$catvoice_account$catvoice_deletion";

        location = / { return 302 /account-app/?product=1; }
        location = /account-app { return 302 /account-app/?product=1; }
        location ^~ /account-app/ { proxy_pass http://catvoice_app; }
        location ~ ^/api/e4/auth/(request-code|verify-code|logout)$ { proxy_pass http://catvoice_app; }
        location = /api/e4/account { proxy_pass http://catvoice_app; }
        location = /api/e4/cat/adopt { proxy_pass http://catvoice_app; }
        location ~ "^/api/e4/requests/[a-f0-9-]{36}$" { proxy_pass http://catvoice_app; }
        location ^~ /api/e4/v1/ { proxy_pass http://catvoice_app; }
        location ^~ /api/e4/privacy/ { proxy_pass http://catvoice_app; }
        # Default gate is return 503; replacing it is a separate reviewed action.
        location ^~ /api/e4/voice/ { include /etc/cat-voice-test/proxy/voice-gate.conf; }
        # /local-review, legacy/admin APIs, synthetic OTP and old seed pages
        # are outside this allow-list; the actual Next app stays loopback-only.
        location / { return 404; }
    }
}
