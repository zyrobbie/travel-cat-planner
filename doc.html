<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有猫来信 · 文档</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div class="wrap">

  <div class="docnav">
    <a href="index.html">← 返回目录</a>
    <a href="decisions.html">🚪 待决策议题</a>
  </div>

  <div id="doc-content">
    <div class="doc-loading">🐾 文档加载中…</div>
  </div>

  <footer>
    <p>🐾 有猫来信 · 由产品战略团队 AI 协作推进 · 重要决策由产品负责人审定</p>
  </footer>

</div>
<script>
var DOCS = {
  "idea":   { file: "docs/idea.md",   title: "《有猫来信初始想法》V2.1" },
  "manual": { file: "docs/manual.md", title: "有猫来信项目执行总纲 V2.1" }
};

function getParam(name) {
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : null;
}

var key = getParam("doc") || "idea";
var meta = DOCS[key] || DOCS["idea"];
document.title = meta.title + " · 有猫来信";

fetch(meta.file)
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(function (md) {
    marked.setOptions({ breaks: true, gfm: true });
    document.getElementById("doc-content").innerHTML = marked.parse(md);
  })
  .catch(function (e) {
    document.getElementById("doc-content").innerHTML =
      '<div class="doc-loading">😿 文档加载失败（' + e.message + '），请返回目录重试。</div>';
  });
</script>
</body>
</html>
